services:
  - type: web
    name: balancevault-api
    runtime: node
    rootDir: backend
    buildCommand: npm install --include=dev --no-audit --no-fund && npm run db:generate
    startCommand: npm run db:migrate && npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: REDIS_URL
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://balancevault-frontend.onrender.com

  - type: web
    name: balancevault-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://balancevault-api-v2.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
